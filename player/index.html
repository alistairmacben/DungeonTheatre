<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a10" />
    <title>Dungeon Stage</title>
    <script>
      // Last-resort error reporter.
      //
      // React error boundaries cannot catch a failure that happens while the
      // modules are still loading — if an import throws, React never runs and
      // the page stays blank with nothing to report. This runs first and paints
      // whatever went wrong directly into the document, so a white screen is
      // never the only symptom.
      ;(function () {
        function show(title, detail) {
          var root = document.getElementById('root') || document.body
          root.innerHTML =
            '<div style="font:14px/1.6 ui-sans-serif,system-ui,sans-serif;color:#e7e3f4;background:#0b0a10;min-height:100vh;padding:32px;box-sizing:border-box">' +
            '<h1 style="color:#ff9a9a;font-size:18px;margin:0 0 8px">' +
            title +
            '</h1><pre style="white-space:pre-wrap;color:#9a93ad;font-size:12px;margin:0">' +
            String(detail).replace(/[<>&]/g, function (c) {
              return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]
            }) +
            '</pre></div>'
        }
        window.addEventListener('error', function (e) {
          show('Failed to start', (e.error && e.error.stack) || e.message || 'Unknown error')
        })
        window.addEventListener('unhandledrejection', function (e) {
          show('Failed to start', (e.reason && (e.reason.stack || e.reason.message)) || e.reason)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
